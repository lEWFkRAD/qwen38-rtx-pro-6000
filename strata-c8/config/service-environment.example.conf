# Example systemd drop-in environment only. No unit is installed or enabled here.
# Both the Python service and its engine/vision children need these inherited values.
[Service]
Environment=PYTHONPATH=/srv/qwen/runtime-0.1.42
Environment=PYTHONDONTWRITEBYTECODE=1
Environment=STRATA_VERIFY_ALL_RESIDENT=1
Environment=STRATA_ARENA_MMAP=1
Environment=STRATA_ADMIT_ROTATE=1
Environment=STRATA_ADMIT_ROTATE_QUANTUM=32768
Environment=STRATA_SLOT_QUEUE=1
